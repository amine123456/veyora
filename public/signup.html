<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create an account | Veyora</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#04222A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
<script src="auth.js" defer></script>
</head>
<body>
<main class="auth">
  <a class="brand" href="/"><span class="brand__mark" aria-hidden="true">V</span>Veyora</a>
  <section class="card" aria-labelledby="auth-title">
    <h1 id="auth-title">Create your account</h1>
    <p class="card__sub">Residential proxies from $2 per GB. You only pay for the traffic you buy.</p>
    <form class="form" data-auth="signup" novalidate>
      <label class="field">
        <span>Email</span>
        <input type="email" name="email" autocomplete="email" required maxlength="254">
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" name="password" autocomplete="new-password" required minlength="10" maxlength="256" aria-describedby="password-hint">
        <small id="password-hint">At least 10 characters.</small>
      </label>
      <p class="form__error" role="alert" hidden></p>
      <button class="btn" type="submit">Create account</button>
    </form>
    <p class="card__switch">Already have an account? <a href="/login">Log in</a></p>
    <p class="card__switch">By creating an account, you agree to the <a href="/terms">Terms</a> and <a href="/acceptable-use">Acceptable Use Policy</a>. See our <a href="/privacy">Privacy Policy</a>.</p>
  </section>
</main>
</body>
</html>
