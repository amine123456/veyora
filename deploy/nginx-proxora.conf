# Website, signup and dashboard. Replace proxora.example with your domain.
# certbot --nginx adds the HTTPS listener and the HTTP->HTTPS redirect to this file.
server {
    listen 80;
    listen [::]:80;
    server_name proxora.example www.proxora.example;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        # The app compares Origin with Host to block cross-site requests, so Host must pass through.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # The admin API listens on 127.0.0.1:3101 and is deliberately not proxied here.
}

# gate.proxora.example only needs to exist so certbot can issue the gateway's certificate.
# Customers connect to the gateway itself on port 8443, not through nginx.
server {
    listen 80;
    listen [::]:80;
    server_name gate.proxora.example;
    location / { return 404; }
}
