# Website, signup and dashboard for the temporary Veyora sslip.io domain.
# certbot --nginx adds the HTTPS listener and the HTTP->HTTPS redirect to this file.
server {
    listen 80;
    listen [::]:80;
    server_name veyora.157-230-28-253.sslip.io;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        # The app compares Origin with Host to block cross-site requests, so Host must pass through.
        proxy_set_header Host $host;
        # Rate limits key on the visitor's address; without this every visitor looks like 127.0.0.1.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Web Unlocker API. One call can retry several exits for up to 90 s, so it gets a
    # longer read timeout; responses are buffered JSON of at most ~14 MB (10 MB base64).
    location /v1/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 16k;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # The admin API listens on 127.0.0.1:3101 and is deliberately not proxied here.
}

# gate.157-230-28-253.sslip.io only needs to exist so certbot can issue the gateway's certificate.
# Customers connect to the gateway itself on port 8443, not through nginx.
server {
    listen 80;
    listen [::]:80;
    server_name gate.157-230-28-253.sslip.io;
    location / { return 404; }
}
